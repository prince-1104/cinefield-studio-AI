services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adstudio
      POSTGRES_PASSWORD: adstudio
      POSTGRES_DB: adstudio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adstudio"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://adstudio:adstudio@postgres:5432/adstudio
    volumes:
      - ./backend:/app
      - artifacts:/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://adstudio:adstudio@postgres:5432/adstudio
    volumes:
      - ./backend:/app
      - artifacts:/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m worker.runner

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  artifacts:

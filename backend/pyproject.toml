[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ad-film-studio"
version = "0.1.0"
description = "AI Ad Film Studio – backend & worker"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1",
    "google-genai>=1.14",
    "openai>=1.60",
    "httpx>=0.28",
    "pillow>=11.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]
